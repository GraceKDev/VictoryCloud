name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
      - name: Check API URL
        run: echo "API URL is $NEXT_PUBLIC_API_URL"
        env:
          NEXT_PUBLIC_BACKEND_URL_DEV: ${{ vars.NEXT_PUBLIC_BACKEND_URL_DEV }}
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL_DEV: ${{ vars.NEXT_PUBLIC_BACKEND_URL_DEV }}
